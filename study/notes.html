<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtremalMath | Notes</title>
    <style>
        :root {
            --ink:         #1b1b1b;
            --muted:       #6d6a63;
            --line:        #e3ded4;
            --accent:      #8c2f39;
            --accent-deep: #6b2229;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); color: var(--ink); background: #fff; line-height: 1.7; }
        .page { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }

        .back-link { display: inline-block; margin-bottom: 24px; text-decoration: none; color: var(--accent); font-weight: 600; }
        .back-link:hover { color: var(--accent-deep); text-decoration: underline; }

        .page-head { border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 28px; }
        .page-head h1 { font-size: 1.8em; color: var(--ink); }
        .page-head .subtitle { color: var(--muted); margin-top: 4px; }

        .res-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            text-decoration: none;
            color: var(--ink);
            transition: color 0.15s;
        }
        .res-row:hover { color: var(--accent); }
        .res-row .left { display: flex; flex-direction: column; }
        .res-row .name { font-weight: 600; }
        .res-row .sub { font-size: 0.86em; color: var(--muted); margin-top: 3px; }
        .res-row .tag { flex-shrink: 0; font-size: 0.76em; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 2px 9px; }

        .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; font-size: 0.85em; color: var(--muted); }
    </style>
</head>
<body>
    <div class="page">

        <a href="materials.html" class="back-link">← Back to Materials</a>

        <div class="page-head">
            <h1>Course Notes</h1>
            <p class="subtitle">Research papers and study materials.</p>
        </div>

        <a class="res-row" href="../notes/Notes_on_Density_conditions_for_triangles_in_multipartite_graph_V6.pdf" target="_blank" rel="noopener">
            <span class="left">
                <span class="name">Notes on Density Conditions for Triangles in Multipartite Graph</span>
                <span class="sub">Graph Theory / Extremal Combinatorics (V6)</span>
            </span>
            <span class="tag">PDF</span>
        </a>

        <div class="footer">
            <p>© 2026 ExtremalMath</p>
            <p style="margin-top:6px;">Last updated Oct 16, 2026</p>
        </div>

    </div>
</body>
</html>
