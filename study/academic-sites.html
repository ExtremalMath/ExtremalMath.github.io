<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtremalMath | Academic Sites</title>
    <style>
        :root {
            --ink:         #1b1b1b;
            --muted:       #6d6a63;
            --line:        #e3ded4;
            --accent:      #8c2f39;
            --accent-deep: #6b2229;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        body { font-family: var(--sans); color: var(--ink); background: #fff; line-height: 1.7; }
        .page { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }

        .back-link { display: inline-block; margin-bottom: 24px; text-decoration: none; color: var(--accent); font-weight: 600; }
        .back-link:hover { color: var(--accent-deep); text-decoration: underline; }

        .page-head { border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 28px; }
        .page-head h1 { font-size: 1.8em; color: var(--ink); }
        .page-head .subtitle { color: var(--muted); margin-top: 4px; }

        .res-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            text-decoration: none;
            color: var(--ink);
            transition: color 0.15s;
        }
        .res-row:hover { color: var(--accent); }
        .res-row .name { font-weight: 600; color: var(--ink); }
        .res-row .sub { font-size: 0.86em; color: var(--muted); }

        .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; font-size: 0.85em; color: var(--muted); }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="page">

        <a href="materials.html" class="back-link">← Back to Materials</a>

        <div class="page-head">
            <h1>Academic Sites</h1>
            <p class="subtitle">Curated resources for books, papers, and mathematical research.</p>
        </div>

        <a href="https://link.springer.com/" target="_blank" rel="noopener noreferrer" class="res-row">
            <span class="name">Springer</span>
            <span class="sub">Books and journals in mathematics and sciences</span>
        </a>

        <a href="https://arxiv.org/" target="_blank" rel="noopener noreferrer" class="res-row">
            <span class="name">arXiv</span>
            <span class="sub">Open-access preprints for mathematics and physics</span>
        </a>

        <a href="https://mathworld.net.cn/" target="_blank" rel="noopener noreferrer" class="res-row">
            <span class="name">MathWorld 中文版</span>
            <span class="sub">中文数学概念查询平台</span>
        </a>

        <div class="footer">
            <p>© 2026 ExtremalMath</p>
            <p style="margin-top:6px;">Last updated Oct 17, 2026</p>
        </div>

    </div>
</body>
</html>
