<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Curated academic sites: literature download platforms, AI work platforms, math tools, and math Q&A forums.">
    <title>ExtremalMath | Academic Sites</title>
    <link rel="icon" type="image/x-icon" href="../picture/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../picture/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../picture/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../picture/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../picture/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../picture/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../picture/favicon-512.png">
<style>
        :root {
            --ink:         #1b1b1b;
            --muted:       #6d6a63;
            --line:        #e3ded4;
            --accent:      #8c2f39;
            --accent-deep: #6b2229;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        body { font-family: var(--sans); color: var(--ink); background: #fff; line-height: 1.7; }
        .page { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }

        .back-link { display: inline-block; margin-bottom: 24px; text-decoration: none; color: var(--accent); font-weight: 600; }
        .back-link:hover { color: #8B0000; text-decoration: underline; transform: skewX(-10deg); }

        .page-head { border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 28px; }
        .page-head h1 { font-size: 1.8em; color: var(--ink); }
        .page-head .subtitle { color: var(--muted); margin-top: 4px; }

        .page-head h1 .text-hover:hover,
        .page-head .subtitle .text-hover:hover,
        .footer .text-hover:hover {
            color: #8B0000;
            transform: skewX(-10deg);
        }

        .res-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            text-decoration: none;
            color: var(--ink);
            transition: color 0.2s ease;
        }
        .res-row:hover { color: #8B0000; }
        .res-row:focus-within { outline: 2px solid #8B0000; outline-offset: 2px; }
        .res-row .name { font-weight: 600; color: var(--ink); }
        .res-row .sub { font-size: 0.86em; color: var(--muted); }

        /* Text hover effect: tilt + deep red. Every piece of text rendered by
           sites.js is wrapped in .text-hover so names, descriptions and notes
           all respond the same way. Skew is applied to the inline wrapper,
           not the flex row, so the row layout never shifts. */
        .text-hover {
            display: inline;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .text-hover:hover {
            color: #8B0000;
            transform: skewX(-10deg);
            display: inline-block;
        }

        .category {
            margin-top: 32px;
            font-size: 0.82em;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            border-bottom: 1px solid var(--line);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .category:first-of-type { margin-top: 0; }

        .alert {
            font-size: 0.78em;
            color: #b33;
            white-space: normal;
            flex-shrink: 0;
            max-width: 45%;
        }
        /* Keeps the alert span in the same flex slot it had before the
           .text-hover wrapper was added, so row layout is unchanged. */
        .alert-wrap { flex-shrink: 0; max-width: 45%; }

        .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; font-size: 0.85em; color: var(--muted); }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="page">

        <a href="materials.html" class="back-link">← Back to Materials</a>

        <div class="page-head">
            <h1><span class="text-hover">Academic Sites</span></h1>
            <p class="subtitle"><span class="text-hover">Curated resources for books, papers, and mathematical research.</span></p>
        </div>

        <div id="sites-container" aria-live="polite">
            <!-- Rendered by sites.js -->
        </div>

        <div class="footer">
            <p><span class="text-hover">© 2026 ExtremalMath</span></p>
            <p style="margin-top:6px;"><span class="text-hover">Last updated Oct 21, 2026</span></p>
        </div>

    </div>

<script src="sites.js"></script>
</body>
</html>
