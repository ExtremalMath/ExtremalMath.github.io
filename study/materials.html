<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtremalMath | Materials</title>
    <style>
        :root {
            --ink:         #1b1b1b;
            --muted:       #6d6a63;
            --line:        #e3ded4;
            --accent:      #8c2f39;
            --accent-deep: #6b2229;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        body {
            font-family: var(--sans);
            margin: 0;
            padding: 0;
            line-height: 1.7;
            color: var(--ink);
            background: #fff;
        }

        .page { max-width: 720px; margin: 0 auto; padding: 40px 20px 60px; }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            text-decoration: none;
            color: var(--accent);
            font-weight: 600;
            font-size: 0.95em;
        }
        .back-link:hover { color: var(--accent-deep); text-decoration: underline; }

        h1 {
            font-size: 1.8em;
            color: var(--ink);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .intro { color: var(--muted); margin-bottom: 26px; font-size: 0.96em; }
        .intro p { margin: 0 0 4px; }

        .res-list { margin-top: 6px; }

        .res-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 2px;
            border-bottom: 1px solid var(--line);
            text-decoration: none;
            color: var(--ink);
            transition: color 0.15s;
        }
        .res-row:hover { color: var(--accent); }
        .res-row .name { font-weight: 600; font-size: 1.02em; }
        .res-row .tag {
            font-size: 0.78em;
            color: var(--muted);
            font-weight: 400;
            white-space: nowrap;
        }
        .res-row:hover .tag { color: var(--accent); }

        .footer {
            margin-top: 48px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: 0.85em;
            color: var(--muted);
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

<div class="page">

    <a href="../index.html" class="back-link">&larr; Back to Home</a>

    <h1>Study Materials</h1>
    <div class="intro">
        <p>Select a category to view resources.</p>
    </div>

    <div class="res-list">
        <a href="homework.html" class="res-row"><span class="name">Homework</span></a>
        <a href="course-essay.html" class="res-row"><span class="name">Course Essay</span></a>
        <a href="notes.html" class="res-row"><span class="name">Notes</span></a>
        <a href="books.html" class="res-row"><span class="name">Books</span></a>
        <a href="academic-sites.html" class="res-row"><span class="name">Academic Sites</span></a>
        <a href="../teaching.html" class="res-row"><span class="name">Teaching</span><span class="tag">Soon</span></a>
    </div>

    <div class="footer">
        &copy; 2026 ExtremalMath
        <p style="margin-top:6px;">Last updated Oct 17, 2026</p>
    </div>

</div>

</body>
</html>
