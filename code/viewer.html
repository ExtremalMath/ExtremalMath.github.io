<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtremalMath | Code Viewer</title>
    <link rel="icon" type="image/x-icon" href="../picture/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../picture/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../picture/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../picture/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../picture/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../picture/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../picture/favicon-512.png">
    <style>
        :root {
            --ink:         #1b1b1b;
            --muted:       #6d6a63;
            --line:        #e3ded4;
            --accent:      #8c2f39;
            --accent-deep: #6b2229;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
            --code-bg:   #fbfaf7;
            --code-fg:   #1b1b1b;
            --code-comment:  #6d6a63;
            --code-keyword:  #8c2f39;
            --code-string:   #3a5a40;
            --code-numeric:  #6b2229;
            --code-preproc:  #6d6a63;
            --code-type:     #3a5a40;
            --code-func:     #1b1b1b;
            --line-bg:     #f5f3ee;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        body { font-family: var(--sans); color: var(--ink); background: #fff; line-height: 1.7; }
        .page { max-width: 900px; margin: 0 auto; padding: 40px 20px 60px; }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            text-decoration: none;
            color: var(--accent);
            font-weight: 600;
        }
        .back-link:hover { color: var(--accent-deep); text-decoration: underline; }

        .page-head { border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 28px; }
        .page-head h1 { font-size: 1.8em; color: var(--ink); }
        .page-head .subtitle { color: var(--muted); margin-top: 4px; }
        .page-head .subtitle .path {
            font-family: var(--mono);
            font-size: 0.88em;
            color: var(--muted);
            background: var(--code-bg);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--line);
        }

        /* ---- toolbar ---- */
        .toolbar {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin: 24px 0 12px;
            flex-wrap: wrap;
        }
        .toolbar .lang {
            font-size: 0.86em;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 0.86em;
            font-weight: 600;
            color: var(--accent);
            background: var(--code-bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.15s, color 0.15s;
        }
        .btn:hover { background: var(--accent); color: #fff; }
        .btn[disabled] { opacity: 0.5; cursor: default; }
        .btn[disabled]:hover { background: var(--code-bg); color: var(--accent); }

        /* ---- code wrapper ---- */
        .code-wrap {
            background: var(--code-bg);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: auto;
            max-height: 85vh;
        }
        .code-wrap code {
            display: block;
            font-family: var(--mono);
            font-size: 0.88em;
            line-height: 1.65;
            color: var(--code-fg);
            background: transparent;
            padding: 16px 20px;
            white-space: pre;
            tab-size: 4;
        }
        .code-wrap code .line {
            display: block;
            padding: 0 8px;
            border-left: 2px solid transparent;
        }
        .code-wrap code .line:hover {
            background: var(--line-bg);
            border-left-color: var(--accent);
        }
        .code-wrap code .line-num {
            display: inline-block;
            width: 2.2em;
            color: var(--muted);
            text-align: right;
            padding-right: 12px;
            user-select: none;
            opacity: 0.65;
        }

        /* ---- syntax colors ---- */
        .c-comment { color: var(--code-comment); font-style: italic; }
        .c-keyword { color: var(--code-keyword); font-weight: 600; }
        .c-string  { color: var(--code-string); }
        .c-number  { color: var(--code-numeric); }
        .c-preproc { color: var(--code-preproc); font-weight: 600; }
        .c-type    { color: var(--code-type); font-weight: 600; }
        .c-func    { color: var(--code-func); }

        .error-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-style: italic;
        }

        .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; font-size: 0.85em; color: var(--muted); }

        @media (max-width: 480px) {
            .page { padding: 30px 12px 50px; }
            .code-wrap code { font-size: 0.82em; padding: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    
/* All hyperlinks: hover makes the text deep red and tilted.
   Navigation "Back to ..." links (class .back-link or .btn) keep their original style. */
a:not(.back-link):not(.btn):hover {
  color: #8B0000;
  transform: skewX(-10deg);
  transform-origin: left center;
  transition: color 0.2s ease, transform 0.2s ease;
}
</style>
</head>
<body>

<div class="page">

    <a href="index.html" class="back-link">← Back to Code</a>

    <div class="page-head">
        <h1>Code viewer</h1>
        <p class="subtitle">
            Local syntax-highlighted preview — decoded as UTF-8 so comments show correctly.
            <span class="path" id="viewer-path">—</span>
        </p>
    </div>

    <div class="toolbar">
        <span class="lang" id="viewer-lang">C++</span>
        <button class="btn" id="btn-copy" disabled onclick="copySource()">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy source
        </button>
        <a class="btn" id="btn-github" href="#" target="_blank" rel="noopener">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.752-1.333-1.752-1.092-.744.086-.729.086-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .324.217.691.825.578C20.565 21.795 24 17.297 24 12c0-6.63-5.37-12-12-12z"/></svg>
            View on GitHub
        </a>
    </div>

    <div id="viewer-wrap" class="code-wrap">
        <div class="error-box">Loading source...</div>
    </div>

    <div class="footer">
        <p>Hand-written C++ exercises from coursework and personal study.</p>
        <p style="margin-top:6px;">Last updated Oct 22, 2026</p>
    </div>

</div>

<script>
    var CFG = {
        repo: "https://github.com/ExtremalMath/eopenaccess",
        codeDir: "code/",
        files: {
            "ticket_system.cpp":  "cpp/data_structure/ticket_system.cpp",
            "tour_map.cpp":       "cpp/data_structure/tour_map.cpp",
            "twenty_four_game.cpp":  "cpp/data_structure/twenty_four_game.cpp",
            "huffman_player_names.cpp": "cpp/data_structure/huffman_player_names.cpp"
        }
    };

    function param(key) {
        var m = new RegExp("[?&]" + key + "=([^&]*)").exec(location.search);
        return m ? decodeURIComponent(m[1]) : "";
    }

    function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    var KW = ["if","else","for","while","do","switch","case","return","struct","class","typedef","enum","namespace","using","union","const","static","extern","inline","virtual","typename","template","void","int","char","float","double","long","unsigned","bool","true","false","NULL","nullptr","auto","register","volatile","const_cast","static_cast","dynamic_cast","reinterpret_cast","public","private","protected","override","final","sizeof"];
    var CT = ["std","string","vector","map","unordered_map","set","queue","stack","deque","pair","list","array","bitset","tuple"];
    var ID_GEN = ["main","printf","scanf","sqrt","abs","cin","cout","endl","calloc","malloc","free","memset","strlen","strcmp","memcpy","fopen","fclose","fcloseall","getchar","putchar","fgets","fputs","srand","rand","atoi","atof","exit"];

    function token(type, x) { return '<span class="c-' + type + '">' + x + '</span>'; }

    function highlightCpp(src) {
        var out = [];
        var i = 0, n = src.length;
        while (i < n) {
            var ch = src[i];
            if ((ch === '"' || ch === "'") && (i + 1 < n)) {
                var q = ch, j = i + 1;
                while (j < n && src[j] !== q) {
                    if (src[j] === "\\") { j++; }
                    j++;
                }
                out.push(token("string", src.slice(i, Math.min(j + 1, n))));
                i = j + 1; continue;
            }
            if (ch === '/' && (i + 1 < n) && src[i + 1] === '/') {
                var e = src.indexOf("\n", i);
                e = e < 0 ? n : e;
                out.push(token("comment", src.slice(i, e)));
                i = e; continue;
            }
            if (ch === '/' && (i + 1 < n) && src[i + 1] === '*' && (i + 2 < n) && src[i + 2] !== '*') {
                var e2 = src.indexOf("*/", i + 2);
                e2 = e2 < 0 ? n : e2 + 2;
                out.push(token("comment", src.slice(i, e2)));
                i = e2; continue;
            }
            if (ch === '#') {
                var e3 = src.indexOf("\n", i);
                e3 = e3 < 0 ? n : e3;
                out.push(token("preproc", src.slice(i, e3)));
                i = e3; continue;
            }
            if (/[0-9]/.test(ch) || (ch === '-' && i + 1 < n && /[0-9]/.test(src[i+1]))) {
                var k = i;
                while (k < n && /[\w.\d_xXfF]/.test(src[k])) { k++; }
                out.push(token("number", src.slice(i, k)));
                i = k; continue;
            }
            if (/[A-Za-z_]/.test(ch)) {
                var k2 = i;
                while (k2 < n && /[A-Za-z_0-9]/.test(src[k2])) { k2++; }
                var word = src.slice(i, k2);
                if (KW.indexOf(word) >= 0) { out.push(token("keyword", word)); }
                else if (CT.indexOf(word) >= 0) { out.push(token("type", word)); }
                else if (ID_GEN.indexOf(word) >= 0) { out.push(token("func", word)); }
                else { out.push(word); }
                i = k2; continue;
            }
            out.push(ch);
            i++;
        }
        return out.join("");
    }

    (function () {
        var file = param("file");
        var dir = param("dir") || "";
        var lang = param("lang") || "C++";
        if (!file || !CFG.files[dir + file] && !CFG.files[file]) {
            document.getElementById("viewer-wrap").innerHTML = "<div class='error-box'>Please select a code file to preview.</div>";
            return;
        }
        var pathEl = document.getElementById("viewer-path");
        var langEl = document.getElementById("viewer-lang");
        var copyBtn = document.getElementById("btn-copy");
        var githubBtn = document.getElementById("btn-github");
        var rel = CFG.files[file] || (CFG.codeDir + dir + file);
        pathEl.textContent = rel;
        langEl.textContent = lang;
        githubBtn.href = CFG.repo + "/tree/main/" + rel.slice(CFG.codeDir.length);

        var sourceText = "";
        var lines = [];

        var X = new XMLHttpRequest();
        X.open("GET", rel + "?" + Date.now(), true);
        X.responseType = "arraybuffer";
        X.onload = function () {
            if (X.status === 200 || X.status === 304 || X.status === 0) {
                var buf = X.response;
                try {
                    sourceText = new TextDecoder("utf-8").decode(buf);
                } catch (e) {
                    document.getElementById("viewer-wrap").innerHTML = "<div class='error-box'>Decoding failed.</div>";
                    return;
                }
                sourceText = sourceText.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
                var allLines = sourceText.split("\n");
                var highlighted = "";
                for (var i2 = 0; i2 < allLines.length; i2++) {
                    highlighted += '<span class="line"><span class="line-num">' + (i2 + 1) + '</span>' + highlightCpp(allLines[i2]) + '</span>';
                }
                document.getElementById("viewer-wrap").innerHTML = "<code>" + highlighted + "</code>";
                copyBtn.disabled = false;
            } else {
                document.getElementById("viewer-wrap").innerHTML = "<div class='error-box'>Could not load " + esc(rel) + " (status " + X.status + ")</div>";
            }
        };
        X.onerror = function () {
            document.getElementById("viewer-wrap").innerHTML = "<div class='error-box'>Network error while loading " + esc(rel) + "</div>";
        };
        X.send();
    })();

    function copySource() {
        var el = document.querySelector(".code-wrap code");
        var text = el ? el.textContent : "";
        if (!text) { alert("No source to copy"); return; }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { alert("Copied to clipboard."); }, function () { alert("Copy failed."); });
        } else {
            var ta = document.createElement("textarea");
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            alert("Copied to clipboard.");
        }
    }
</script>

</body>
</html>
