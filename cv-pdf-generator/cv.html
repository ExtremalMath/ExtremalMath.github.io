<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历 / CV（PDF）· ExtremalMath</title>
    <link rel="icon" type="image/x-icon" href="../picture/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../picture/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../picture/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../picture/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../picture/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../picture/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../picture/favicon-512.png">
    <style>
        :root {
            --bg:          #fbfaf7;
            --ink:         #1b1b1b;
            --accent:      #8c2f39;
            --accent-deep: #6b2229;
            --muted:       #6d6a63;
            --line:        #e3ded4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
            background: #fff;
            color: var(--ink);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .hub { max-width: 720px; width: 100%; text-align: center; }
        .back-link {
            display: block;
            text-align: left;
            margin-bottom: 20px;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.95em;
        }
        .back-link:hover { color: var(--accent-deep); text-decoration: underline; }
        .hub h1 {
            font-size: 1.8em;
            color: var(--ink);
            display: inline-block;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--accent);
        }
        .hub .sub { color: var(--muted); margin: 12px 0 24px; font-size: 0.95em; }
        .cards { text-align: left; }
        .lang-card {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
            text-decoration: none;
            color: var(--ink);
            transition: color 0.15s;
        }
        .lang-card:hover { color: var(--accent); }
        .lang-card .name { font-weight: 600; font-size: 1.02em; }
        .lang-card .tag {
            flex-shrink: 0;
            font-size: 0.78em;
            color: var(--muted);
            font-weight: 400;
            white-space: nowrap;
        }
        .note { margin-top: 24px; font-size: 0.85em; color: var(--muted); }

        @media (max-width: 600px) {
            .hub h1 { font-size: 1.5em; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="hub">
        <a class="back-link" href="../about.html">← Back to About</a>
        <h1>简历 / CV（PDF）</h1>
        <p class="sub">选择语言版本，在独立页面中查看、打印或下载。每份均从本站公开页面实时抓取生成，已自动排除课程作业与非公开信息。</p>
        <div class="cards">
            <a class="lang-card" href="cv-zh.html"><span class="name">📄 中文版简历</span><span class="tag">Chinese version</span></a>
            <a class="lang-card" href="cv-en.html"><span class="name">📄 English CV</span><span class="tag">English version</span></a>
        </div>
        <p class="note">输出为纵向（portrait）A4，黑框白底、简洁精炼；可浏览器打印「另存为 PDF」，或在各语言页内一键下载。</p>
    </div>
</body>
</html>
