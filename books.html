<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtremalMath | GTM 244 - Graph Theory</title>
    <!-- ... (样式部分保持不变) ... -->
    <style>
        /* ... (之前的样式代码) ... */
        
        /* 新增按钮样式 */
        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .btn {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }
        .btn-secondary {
            background-color: #eaeaea;
            color: #333;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ... (导航栏部分保持不变) ... -->
        
        <div class="note">
            <em>Graph Theory</em> by J.A. Bondy and U.S.R. Murty, Graduate Texts in Mathematics 244, Springer. ISBN 978-1-84628-969-9.
        </div>

        <div class="file-item">
            <div class="file-header" onclick="toggle(this)">
                <span class="icon">📕</span>
                <span class="name">GTM 244 - Bondy J.A., Murty U.S.R. - Graph Theory</span>
                <span class="arrow">▼</span>
            </div>
            <div class="preview">
                <!-- 注意：这里的路径必须与你实际的文件路径完全一致 -->
                <iframe data-src="./book/GTM_244_Bondy_Murty_Graph_Theory.pdf"></iframe>
                
                <!-- 新增的操作按钮 -->
                <div class="actions">
                    <a href="./book/GTM_244_Bondy_Murty_Graph_Theory.pdf" target="_blank" class="btn btn-primary">Read Online</a>
                    <a href="./book/GTM_244_Bondy_Murty_Graph_Theory.pdf" download class="btn btn-secondary">Download</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggle(el) {
            const preview = el.nextElementSibling;
            const arrow = el.querySelector('.arrow');
            const iframe = preview.querySelector('iframe');

            if (preview.style.display === 'block') {
                preview.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            } else {
                preview.style.display = 'block';
                arrow.style.transform = 'rotate(180deg)';
                // 只有当 iframe 还没有加载过 src 时才赋值，避免重复刷新
                if (!iframe.src || iframe.src === window.location.href) {
                    iframe.src = iframe.getAttribute('data-src');
                }
            }
        }
    </script>
</body>
</html>
