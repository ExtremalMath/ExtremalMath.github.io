<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtremalMath | Theatre Reviews</title>
    <link rel="icon" type="image/x-icon" href="picture/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="picture/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="picture/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="picture/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="picture/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="picture/favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="picture/favicon-512.png">
    <style>
        :root {
            --bg:          #fff;
            --cream:       #fbfaf7;
            --ink:         #1b1b1b;
            --muted:       #6d6a63;
            --line:        #e3ded4;
            --accent:      #8c2f39;
            --accent-dark: #6b2229;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        body {
            font-family: var(--sans);
            margin: 0;
            padding: 0;
            line-height: 1.7;
            color: var(--ink);
            background: var(--bg);
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 32px;
            text-decoration: none;
            color: var(--accent);
            font-weight: 600;
            transition: color 0.15s;
        }
        .back-link:hover { color: var(--accent-dark); text-decoration: underline; }

        .page-head {
            margin-bottom: 32px;
        }
        .page-head h1 {
            font-size: 1.8em;
            font-weight: 600;
            margin-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 8px;
        }
        .page-head .lede {
            font-size: 1em;
            color: var(--muted);
        }

        .empty {
            font-size: 0.92em;
            color: var(--muted);
        }

        .footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            text-align: center;
            font-size: 0.85em;
            color: var(--muted);
        }

        @media (max-width: 600px) {
            .page { padding: 28px 20px 56px; }
            .page-head h1 { font-size: 1.6em; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

<div class="page">

    <a href="drama.html" class="back-link">← Back to Theatre</a>

    <header class="page-head">
        <h1>Theatre Reviews</h1>
        <p class="lede">Thoughts on the plays and musicals I have watched.</p>
    </header>

    <main>
        <p class="empty">Coming soon.</p>
    </main>

    <footer class="footer">
        <p>© 2026 ExtremalMath</p>
        <p>Last updated Oct 21, 2026</p>
    </footer>

</div>

</body>
</html>
