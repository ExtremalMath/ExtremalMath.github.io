<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtremalMath | 404</title>
    <style>
        :root {
            --ink:         #1b1b1b;
            --muted:       #6d6a63;
            --line:        #e3ded4;
            --accent:      #8c2f39;
            --accent-deep: #6b2229;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--sans);
            color: var(--ink);
            background: #fff;
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 720px; width: 100%; text-align: center; }

        .aleph {
            font-size: 4rem;
            color: var(--accent);
            font-family: 'Times New Roman', serif;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.8em;
            color: var(--ink);
            margin-bottom: 0.5rem;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--accent);
        }
        .quote-original {
            font-style: italic;
            font-size: 1.05em;
            color: var(--ink);
            margin: 1.5rem 0 0.5rem 0;
        }
        .quote-translation {
            font-size: 0.95em;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }
        .quote-attribution {
            font-size: 0.85em;
            color: var(--muted);
            margin-bottom: 2rem;
        }
        .btn-group { display: flex; justify-content: center; gap: 24px; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: 600;
            color: var(--accent);
        }
        .btn:hover { color: var(--accent-deep); text-decoration: underline; }

        footer {
            margin-top: 48px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            font-size: 0.85em;
            color: var(--muted);
        }
        footer p { margin: 0; }
        footer .updated { margin-top: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="aleph">ℵ</div>
        <h1>404</h1>
        <p class="quote-original">
            "Cuius rei demonstrationem mirabilem sane detexi. Hanc marginis exiguitas non caperet."
        </p>
        <p class="quote-translation">
            I have discovered a truly marvelous proof of this, which this margin is too narrow to contain.
        </p>
        <p class="quote-attribution">— Pierre de Fermat, 1637</p>
        <div class="btn-group">
            <a href="index.html" class="btn">Back to Home</a>
            <a href="nownow/now.html" class="btn">what I'm doing now</a>
        </div>

        <footer>
            <p>© 2026 ExtremalMath</p>
            <p class="updated">Last updated Oct 17, 2026</p>
        </footer>
    </div>
</body>
</html>
