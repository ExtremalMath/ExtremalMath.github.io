      display: inline-block;
      margin-bottom: 28px;

    .back-link:hover {
      color: #c0392b;
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #111;
    }

    .intro {
      color: #888;
      font-size: 14px;
      font-style: italic;
      margin-top: 10px;
      margin-bottom: 36px;
    }

    .coming-soon {
      padding: 40px 0;
      color: #aaa;
    }

    .coming-soon .icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
      opacity: 0.7;
    }

    .coming-soon .title {
      font-size: 18px;
      font-weight: 600;
      color: #666;
      margin-bottom: 8px;
    }

    .coming-soon .desc {
      font-size: 14px;
      color: #999;
      line-height: 1.7;
    }

    .mentorship {
      margin-top: 8px;
      padding: 20px 22px;
      background: #f8f9fb;
      border-left: 3px solid #c0392b;
      border-radius: 8px;
      text-align: left;
    }

    .mentorship-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #c0392b;
      margin-bottom: 12px;
    }

    .mentorship p {
      font-size: 15px;
      color: #444;
      margin-bottom: 10px;
      line-height: 1.65;
    }

    .mentorship p:last-child {
      margin-bottom: 0;
    }

    .mentorship strong {
      color: #1a1a1a;
      font-weight: 600;
    }

    .mentorship em {
      font-style: italic;
      color: #333;
    }

    @media (max-width: 480px) {
      body { padding: 40px 16px; }
      .card { padding: 36px 26px; border-radius: 12px; }
      h1 { font-size: 20px; }
      .coming-soon .icon { font-size: 40px; }
    }
