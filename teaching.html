    <title>ExtremalMath | Teaching</title>
    <style>
        :root {
            --ink:         #1b1b1b;
            --muted:       #6d6a63;

            --accent:      #8c2f39;
            --accent-deep: #6b2229;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

        * { margin: 0; padding: 0; box-sizing: border-box; }

        .page-head h1 { font-size: 1.8em; color: var(--ink); }
        .page-head .subtitle { color: var(--muted); margin-top: 4px; }

        .body-text { color: var(--ink); margin-bottom: 18px; }
        .body-text.muted { color: var(--muted); }

        .footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); text-align: center; font-size: 0.85em; color: var(--muted); }

</head>
