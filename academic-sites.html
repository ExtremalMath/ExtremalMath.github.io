<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExtremalMath | Academic Sites</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #0366d6;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #666666;
            --border-color: #eaeaea;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 90%;
            background: var(--card-bg);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
        }

        .back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }
        
        .back-link:hover {
            color: var(--accent-color);
        }

        h1 {
            font-family: 'Lora', serif;
            font-size: 2.5em;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .subtitle {
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        /* 统一的链接框 */
        .link-box {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.5rem 1.5rem;
            margin-top: 2rem;
            background: white;
        }

        .link-item {
            display: block;
            padding: 0.9rem 0;
            text-decoration: none;
            color: var(--text-main);
            border-bottom: 1px solid #f0f0f0;
            transition: color 0.2s;
            text-align: left;
        }

        .link-item:last-child {
            border-bottom: none;
        }

        .link-item:hover {
            color: var(--accent-color);
        }

        .link-name {
            font-weight: 600;
            margin-right: 12px;
        }

        .link-desc {
            font-size: 0.85rem;
            color: var(--text-light);
        }

    </style>
</head>
<body>

    <a href="materials.html" class="back-link">← Back to Materials</a>

    <div class="container">
        <h1>Academic Sites</h1>
        <p class="subtitle">Curated resources for books, papers, and mathematical research.</p>

        <div class="link-box">
            <!-- Springer -->
            <a href="https://link.springer.com/" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="link-name">Springer</span>
                <span class="link-desc">Books and journals in mathematics and sciences</span>
            </a>

            <!-- arXiv -->
            <a href="https://arxiv.org/" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="link-name">arXiv</span>
                <span class="link-desc">Open-access preprints for mathematics and physics</span>
            </a>

            <!-- MathWorld 中文版 -->
            <a href="https://mathworld.net.cn/" target="_blank" rel="noopener noreferrer" class="link-item">
                <span class="link-name">MathWorld 中文版</span>
                <span class="link-desc">中文数学概念查询平台</span>
            </a>
        </div>
    </div>

</body>
</html>
